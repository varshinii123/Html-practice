<!DOCTYPE html>
<html>
<head>
<title>KL Admissions</title>
<style>
body { font-family: Arial; background: #f5f7fb; }
header, footer { background: white; padding: 15px; text-align: center; }
main { background: white; width: 600px; margin: 20px auto; padding: 20px; }
input, select { width: 100%; padding: 8px; margin: 8px 0; }
button { background: blue; color: white; padding: 10px; }
</style>
</head>
<body>
<header>
<h2>KL Admissions</h2>
<nav>Programmes | Apply Online | Track Status</nav>
</header>
<main>
<h2>Online Admission Application</h2>
<form>
<fieldset>
<legend>Personal Details</legend>
<label>Full Name:</label>
<input type="text" required>
<label>Email Address:</label>
<input type="email" required>
<label>Mobile Number:</label>
<input type="tel" required>
</fieldset>
<br>
<fieldset>
<legend>Academic Preferences</legend>
<label>Select Programme:</label>
<select>
<option>B.Tech</option>
<option>BBA</option>
<option>BCA</option>
<option>MBA</option>
</select>
<label>Percentage:</label>
<input type="number">
<label>Upload Marksheet:</label>
<input type="file">
</fieldset>
<br>
<button type="submit">Submit Application</button>
</form>
</main>
<footer>
<p>© 2026 University Admissions Office</p>
<p>KL Admissions Portal</p>
</footer>
</body>
</html>
