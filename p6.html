<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registration Form</title>
</head>
<body style="display: flex; background-color: #FFD1DC;">
<div style="text-align: left;">
<form action="#" method="post" >
<input type="hidden" name="form_id" value="reg-2026">
<p>
<label>Full name:
<input type="text" name="name" required>
</label>
</p>
<p>
<label>Username: <input type="search" name="username"></label></p>
<p><label>Email: <input type="email" name="email" required></label></p>
<p><label>Password: <input type="password" name="password" minlength="8" required></label></p>
<p><label>Phone: <input type="tel" name="phone"></label></p>
<p><label>Website: <input type="url" name="website"></label></p>
<p><label>Age: <input type="number" name="age" min="16" max="100"></label></p>
<p><label>Date of birth: <input type="date" name="dob"></label></p>
<p><label>Call time: <input type="time" name="call_time"></label></p>
<p>
<label>Course:
<select>
<option value="">Choose one</option>
<option>Computer Science</option>
<option>Electronics</option>
<option>Mathematics</option>
</select>
</label>
</p>
